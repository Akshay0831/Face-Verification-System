# Desktop Interface Configuration for Face Verification System
# Generated on: 2022-12-01

interface:
  theme: default
  language: en
  window:
    width: 1200
    height: 800
    maximized: false
    remember_geometry: true
  display:
    show_detections: true
    show_landmarks: false
    show_confidence: true

system:
  camera:
    device_index: 0
    resolution: "1280x720"
    fps: 30
    buffer_size: 10
  processing:
    max_fps: 30
    multi_threading: true
    batch_processing: true
    cache_size: 100
  plugins:
    default_detector: "Basic Detector"
    default_recognizer: "VGG Recognition"
    default_liveness: "Basic Liveness"

performance:
  enable_gpu: false
  gpu_device: 0
  thread_pool_size: 4
  memory_limit_mb: 2048

security:
  data_encryption: true
  log_all_operations: true
  require_admin_for_changes: false
  session_timeout_minutes: 60

logging:
  level: INFO
  file: logs/desktop.log
  max_size_mb: 10
  backup_count: 5
  format: '[%(asctime)s] %(levelname)s - %(message)s'